name: quillmate
description: A distraction-free Markdown writing environment with an animated mascot companion.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Cross-platform file open/save dialogs.
  file_selector: ^1.0.3

  # Hides OS title bar / window decorations in focus mode.
  window_manager: ^0.3.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/idle.png
    - assets/typing.png
    - assets/excited.png
    - assets/encouraging.png
